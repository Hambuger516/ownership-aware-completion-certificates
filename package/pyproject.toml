[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prc-nc"
version = "0.1.0"
description = "Ownership-aware completion certificate research runtime"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prc-nc = "prc_nc.cli:main"

[tool.setuptools.packages.find]
include = ["prc_nc*"]

[tool.setuptools.package-data]
prc_nc = ["data/*.json", "data/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "B006", "B008"]
